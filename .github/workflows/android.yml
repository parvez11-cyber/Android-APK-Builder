name: HomeMonitor APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android Project ZIP
        run: |
          mkdir -p build-project

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname 'HomeMonitor*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "HomeMonitor ZIP not found!"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d build-project

          PROJECT_DIR=$(find build-project -type f \
            -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeMonitor-APK
          path: build-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
